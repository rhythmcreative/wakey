name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component pins homeassistant, which
          # requires Python 3.14+.
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest -q
