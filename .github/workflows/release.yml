name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python -c "import json;print(json.load(open('custom_components/wakey/manifest.json'))['version'])")
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG does not match manifest version $MANIFEST"
            exit 1
          fi

      - name: Check the committed panel bundle is current
        run: |
          cd frontend && npm ci && npm run build && cd ..
          git diff --exit-code custom_components/wakey/frontend/dist/ \
            || { echo "::error::Committed panel bundle is stale — rebuild and commit it"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
